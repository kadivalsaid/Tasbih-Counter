
<!DOCTYPE html>
<html>
<head>
    <title>Tasbih Counter</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="container">

    <header>
        <div class="moon">☾</div>
        <div class="mosque">🕌</div>

        <h1>Tasbih Counter</h1>
        <p>Dhikr • Peace • Blessings</p>
    </header>

    <div class="tasbih">

        <div class="beads"></div>

        <div class="count">
            <span>0</span>
        </div>

    </div>

    <div class="buttons">
        <button class="reset">Reset</button>
        <button class="add">+</button>
        <button class="sub">-</button>
    </div>

    <div class="message">
        <h2>Keep Counting...</h2>
        <p>May Allah Accept Your Dhikr ♥</p>
    </div>

    <div class="bottom">
        🕌
    </div>

</div>

</body>
<script src="Tasbih.js"></script>
</html>
